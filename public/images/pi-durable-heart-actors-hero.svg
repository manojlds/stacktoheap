<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pi Durable ♥ Actors: Agents Across Workers with Rivet</title>
  <desc id="desc">Two worker nodes with an engine between them. The right node, n2, has been killed and holds only the dashed outline of a robot. That robot is in mid-air on a dashed arc over the engine, carrying its small database, on its way to the left node, n1, where two robots are still working and one place is free. Tags read ticks 1 to 11 on the dead node and ticks 12 to 40 on the live one.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121c2f"/><stop offset=".6" stop-color="#121c2e"/><stop offset="1" stop-color="#11303a"/>
    </linearGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop stop-color="#7fc8f2" stop-opacity=".2"/><stop offset="1" stop-color="#7fc8f2" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%"><stop stop-color="#a99be0" stop-opacity=".22"/><stop offset="1" stop-color="#a99be0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%"><stop stop-color="#e5736b" stop-opacity=".13"/><stop offset="1" stop-color="#e5736b" stop-opacity="0"/></radialGradient>
    <linearGradient id="hop" x1="1" x2="0"><stop stop-color="#e5736b"/><stop offset=".5" stop-color="#f2b866"/><stop offset="1" stop-color="#7fe0c0"/></linearGradient>
    <g id="robot">
      <line x1="80" y1="0" x2="80" y2="34" stroke="#8fa2bd" stroke-width="5"/>
      <circle cx="80" cy="-2" r="10" fill="currentColor"/>
      <rect x="10" y="34" width="140" height="96" rx="20" fill="#a9b6cc" stroke="#d9e2ef" stroke-width="4"/>
      <rect x="28" y="52" width="104" height="60" rx="12" fill="#18233a"/>
      <circle cx="60" cy="78" r="8" fill="currentColor"/><circle cx="100" cy="78" r="8" fill="currentColor"/>
      <path d="M66 96q14 10 28 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <rect x="0" y="146" width="160" height="132" rx="20" fill="#9eaac2" stroke="#d9e2ef" stroke-width="4"/>
      <rect x="22" y="166" width="116" height="62" rx="10" fill="#18233a"/>
      <circle cx="80" cy="252" r="6" fill="currentColor"/>
      <rect x="26" y="278" width="34" height="46" rx="10" fill="#6f7d96"/>
      <rect x="100" y="278" width="34" height="46" rx="10" fill="#6f7d96"/>
    </g>
    <g id="ghost" fill="none" stroke="#e5736b" stroke-width="4" stroke-dasharray="9 9" opacity=".7">
      <line x1="80" y1="6" x2="80" y2="34"/>
      <circle cx="80" cy="-2" r="9"/>
      <rect x="10" y="34" width="140" height="96" rx="20"/>
      <rect x="0" y="146" width="160" height="132" rx="20"/>
      <rect x="26" y="278" width="34" height="46" rx="10"/>
      <rect x="100" y="278" width="34" height="46" rx="10"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <g font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="62" y="54" fill="#9fb0c6" font-size="13" font-weight="700" letter-spacing="3.2">EXPLORING PI</text>
    <text x="60" y="108" fill="#f6efe2" font-size="50" font-weight="800">Pi Durable <tspan fill="#f0758a">♥</tspan> Actors</text>
    <text x="62" y="150" fill="#c0cddd" font-size="21">One agent, one owner, any worker.</text>
  </g>

  <!-- Ground -->
  <ellipse cx="600" cy="512" rx="560" ry="56" fill="#0d1626" opacity=".85"/>

  <!-- Worker n1: alive -->
  <circle cx="250" cy="370" r="210" fill="url(#glowB)"/>
  <rect x="70" y="232" width="370" height="262" rx="22" fill="#16233a" stroke="#7fe0c0" stroke-width="2.5"/>
  <rect x="92" y="219" width="92" height="26" rx="13" fill="#12303a" stroke="#7fe0c0" stroke-width="1.5"/>
  <text x="138" y="237" fill="#bff3e1" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">worker n1</text>
  <g transform="translate(100 300) scale(.5)" color="#7fc8f2"><use xlink:href="#robot" href="#robot"/>
    <text x="80" y="207" fill="#7fc8f2" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="34" font-weight="700" text-anchor="middle">b</text></g>
  <g transform="translate(212 300) scale(.5)" color="#c9bdf2"><use xlink:href="#robot" href="#robot"/>
    <text x="80" y="207" fill="#c9bdf2" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="34" font-weight="700" text-anchor="middle">d</text></g>
  <!-- the free place -->
  <rect x="330" y="372" width="84" height="94" rx="14" fill="none" stroke="#7fe0c0" stroke-width="2" stroke-dasharray="6 7" opacity=".7"/>
  <path d="M372 344v18m-9-9 9 9 9-9" fill="none" stroke="#7fe0c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <g font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#bff3e1"><text x="372" y="414">ticks</text><text x="372" y="432">12-40</text></g>

  <!-- Engine -->
  <circle cx="600" cy="400" r="120" fill="url(#glowP)"/>
  <path d="M440 400h85M675 400h95" stroke="#a99be0" stroke-width="3" stroke-dasharray="5 6" opacity=".8"/>
  <rect x="525" y="358" width="150" height="84" rx="16" fill="#332b57" stroke="#a99be0" stroke-width="2.5"/>
  <g font-family="DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">
    <text x="600" y="394" fill="#e6defc" font-size="17" font-weight="700">engine</text>
    <text x="600" y="418" fill="#b5a9e3" font-size="11">who runs where</text>
  </g>

  <!-- Worker n2: killed -->
  <circle cx="950" cy="370" r="200" fill="url(#glowR)"/>
  <rect x="770" y="232" width="360" height="262" rx="22" fill="#151d2e" stroke="#e5736b" stroke-width="2.5" stroke-dasharray="12 9" opacity=".85"/>
  <rect x="1016" y="219" width="92" height="26" rx="13" fill="#2e1c22" stroke="#e5736b" stroke-width="1.5"/>
  <text x="1062" y="237" fill="#f5b9b3" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">worker n2</text>
  <g transform="translate(810 300) scale(.5)"><use xlink:href="#ghost" href="#ghost"/></g>
  <g font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#f5b9b3"><text x="850" y="402">ticks</text><text x="850" y="420">1-11</text></g>
  <g transform="translate(940 322)">
    <rect width="156" height="112" rx="12" fill="#18233a" stroke="#4a5670" stroke-width="2"/>
    <circle cx="18" cy="18" r="4.5" fill="#e5736b"/><circle cx="33" cy="18" r="4.5" fill="#5b6478"/><circle cx="48" cy="18" r="4.5" fill="#5b6478"/>
    <g font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="13">
      <text x="16" y="52" fill="#f2b866">$ kill -9 n2</text>
      <text x="16" y="76" fill="#7f93ab" font-size="11">connection lost</text>
    </g>
    <rect x="16" y="90" width="9" height="13" fill="#e5736b" opacity=".85"/>
  </g>

  <!-- The hop -->
  <path d="M850 288C800 140 460 140 372 336" fill="none" stroke="url(#hop)" stroke-width="3.5" stroke-dasharray="3 10" stroke-linecap="round"/>
  <g transform="translate(568 132) rotate(-9 40 80) scale(.44)" color="#f2b866"><use xlink:href="#robot" href="#robot"/>
    <text x="80" y="207" fill="#f2b866" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="34" font-weight="700" text-anchor="middle">a</text></g>
  <!-- its database, carried along -->
  <g transform="translate(652 214)" fill="#f2b866" stroke="#3a2608" stroke-width="1.5">
    <path d="M0 6v26c0 4 8 7 18 7s18-3 18-7V6z"/>
    <ellipse cx="18" cy="6" rx="18" ry="6.5" fill="#ffd59a"/>
    <path d="M0 19c0 4 8 7 18 7s18-3 18-7" fill="none"/>
  </g>

  <g font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">
    <text x="255" y="548" fill="#7fe0c0">STILL RUNNING</text>
    <text x="600" y="548" fill="#c9bdf2">RIVET</text>
    <text x="950" y="548" fill="#f29b94">GONE</text>
  </g>
</svg>
