<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness on a Claude Subscription in 120 Lines</title>
  <desc id="desc">A blue robot labelled DSH walks in from the left and plugs into two borrowed parts, a PiAiAdapter card from dsh and a pi-claude-code card from Pi, which connect to a Claude Code terminal. Two smaller, dimmer robots labelled OpenCode and Pi stand beside the terminal. Labels read: the new harness, borrowed parts, same login.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121c2f"/><stop offset=".6" stop-color="#121c2e"/><stop offset="1" stop-color="#11303a"/>
    </linearGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop stop-color="#7fc8f2" stop-opacity=".2"/><stop offset="1" stop-color="#7fc8f2" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%"><stop stop-color="#a99be0" stop-opacity=".18"/><stop offset="1" stop-color="#a99be0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowY" cx="50%" cy="50%" r="50%"><stop stop-color="#f2b866" stop-opacity=".16"/><stop offset="1" stop-color="#f2b866" stop-opacity="0"/></radialGradient>
    <linearGradient id="wireA" x1="0" x2="1"><stop stop-color="#7fc8f2"/><stop offset="1" stop-color="#a99be0"/></linearGradient>
    <linearGradient id="wireB" x1="0" x2="1"><stop stop-color="#f2b866"/><stop offset="1" stop-color="#7fe0c0"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <g font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="62" y="54" fill="#9fb0c6" font-size="13" font-weight="700" letter-spacing="3.2">EXPLORING PI</text>
    <text x="60" y="104" fill="#f6efe2" font-size="45" font-weight="800">DeepSeek Harness on a Claude Subscription</text><text x="60" y="156" fill="#f2b866" font-size="45" font-weight="800">in 120 Lines</text>
    <text x="380" y="154" fill="#c0cddd" font-size="21">Borrowing Pi's provider instead of building one.</text>
  </g>

  <!-- Ground -->
  <ellipse cx="600" cy="505" rx="560" ry="60" fill="#0d1626" opacity=".85"/>

  <!-- The new harness: DSH robot walking in -->
  <circle cx="190" cy="350" r="150" fill="url(#glowB)"/>
  <path d="M44 300h-30M50 340h-40M44 380h-30" stroke="#7fc8f2" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <g transform="translate(110 192)">
    <line x1="80" y1="0" x2="80" y2="34" stroke="#8fa2bd" stroke-width="4"/>
    <circle cx="80" cy="-2" r="8" fill="#7fc8f2"/>
    <rect x="10" y="34" width="140" height="96" rx="20" fill="#a9b6cc" stroke="#d9e2ef" stroke-width="3"/>
    <rect x="28" y="52" width="104" height="60" rx="12" fill="#18233a"/>
    <circle cx="60" cy="78" r="7" fill="#7fc8f2"/><circle cx="100" cy="78" r="7" fill="#7fc8f2"/>
    <path d="M66 96q14 10 28 0" fill="none" stroke="#7fc8f2" stroke-width="4" stroke-linecap="round"/>
    <rect x="0" y="146" width="160" height="132" rx="20" fill="#9eaac2" stroke="#d9e2ef" stroke-width="3"/>
    <rect x="22" y="166" width="116" height="62" rx="10" fill="#18233a"/>
    <text x="80" y="205" fill="#7fc8f2" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="20" font-weight="700" text-anchor="middle">DSH</text>
    <circle cx="80" cy="252" r="5" fill="#7fc8f2"/>
    <path d="M2 182c-22 12-30 34-28 60" fill="none" stroke="#8592ab" stroke-width="16" stroke-linecap="round"/>
    <path d="M158 182c30 2 54-6 72-22" fill="none" stroke="#8592ab" stroke-width="16" stroke-linecap="round"/>
    <rect x="22" y="278" width="34" height="46" rx="10" fill="#6f7d96" transform="rotate(-8 39 278)"/>
    <rect x="104" y="278" width="34" height="46" rx="10" fill="#6f7d96" transform="rotate(8 121 278)"/>
  </g>

  <!-- Borrowed parts -->
  <circle cx="555" cy="335" r="130" fill="url(#glowP)"/>
  <path d="M342 352C392 352 400 292 450 292" fill="none" stroke="url(#wireA)" stroke-width="3.5"/>
  <circle cx="342" cy="352" r="6" fill="#7fc8f2"/>
  <g font-family="DejaVu Sans Mono, ui-monospace, monospace" font-weight="700">
    <g transform="translate(450 268)">
      <rect width="210" height="48" rx="10" fill="#332b57" stroke="#a99be0" stroke-width="2"/>
      <text x="105" y="30" fill="#e6defc" font-size="16" text-anchor="middle">PiAiAdapter</text>
      <rect x="150" y="-13" width="56" height="20" rx="10" fill="#1d2840" stroke="#7fc8f2" stroke-width="1.5"/>
      <text x="178" y="1.5" fill="#bfe3f8" font-size="10.5" text-anchor="middle">dsh</text>
    </g>
    <path d="M555 316v32" stroke="#a99be0" stroke-width="3" stroke-dasharray="5 5"/>
    <g transform="translate(450 348)">
      <rect width="210" height="48" rx="10" fill="#f2b866" stroke="#ffd59a" stroke-width="2"/>
      <text x="105" y="30" fill="#3a2608" font-size="16" text-anchor="middle">pi-claude-code</text>
      <rect x="150" y="-13" width="56" height="20" rx="10" fill="#3a2a12" stroke="#f2b866" stroke-width="1.5"/>
      <text x="178" y="1.5" fill="#ffe2b3" font-size="10.5" text-anchor="middle">pi</text>
    </g>
    <text x="555" y="430" fill="#8fa2bd" font-size="12" font-weight="400" text-anchor="middle">+ ~120 lines of glue</text>
  </g>
  <path d="M660 372C700 372 704 322 742 322" fill="none" stroke="url(#wireB)" stroke-width="3.5"/>
  <circle cx="742" cy="322" r="6" fill="#7fe0c0"/>

  <!-- Same login: Claude Code terminal -->
  <circle cx="872" cy="330" r="140" fill="url(#glowY)"/>
  <g transform="translate(742 232)">
    <rect width="260" height="186" rx="16" fill="#3a4a63" stroke="#8fa2bd" stroke-width="2.5"/>
    <rect x="12" y="12" width="236" height="162" rx="10" fill="#18233a"/>
    <circle cx="32" cy="32" r="5.5" fill="#e5736b"/><circle cx="50" cy="32" r="5.5" fill="#e9b85a"/><circle cx="68" cy="32" r="5.5" fill="#62d39b"/>
    <g font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="13">
      <text x="28" y="68" fill="#7fe0c0">&gt; claude -p</text>
      <text x="28" y="90" fill="#7f93ab" font-size="11">--max-turns 1</text>
    </g>
    <rect x="28" y="106" width="150" height="8" rx="4" fill="#5a7bb0"/>
    <rect x="28" y="124" width="104" height="8" rx="4" fill="#34465f"/>
    <rect x="140" y="124" width="56" height="8" rx="4" fill="#62d39b"/>
    <rect x="28" y="142" width="176" height="8" rx="4" fill="#34465f"/>
  </g>

  <!-- The other two harnesses, already there -->
  <g opacity=".6">
    <g transform="translate(1022 300) scale(.46)">
      <line x1="80" y1="0" x2="80" y2="34" stroke="#8fa2bd" stroke-width="6"/>
      <circle cx="80" cy="-2" r="10" fill="#7fe0c0"/>
      <rect x="10" y="34" width="140" height="96" rx="20" fill="#a9b6cc" stroke="#d9e2ef" stroke-width="4"/>
      <rect x="28" y="52" width="104" height="60" rx="12" fill="#18233a"/>
      <circle cx="60" cy="78" r="8" fill="#7fe0c0"/><circle cx="100" cy="78" r="8" fill="#7fe0c0"/>
      <rect x="0" y="146" width="160" height="132" rx="20" fill="#9eaac2" stroke="#d9e2ef" stroke-width="4"/>
      <rect x="22" y="166" width="116" height="62" rx="10" fill="#18233a"/>
      <rect x="30" y="278" width="34" height="46" rx="10" fill="#6f7d96"/>
      <rect x="96" y="278" width="34" height="46" rx="10" fill="#6f7d96"/>
    </g>
    <g transform="translate(1102 300) scale(.46)">
      <line x1="80" y1="0" x2="80" y2="34" stroke="#8fa2bd" stroke-width="6"/>
      <circle cx="80" cy="-2" r="10" fill="#f2b866"/>
      <rect x="10" y="34" width="140" height="96" rx="20" fill="#a9b6cc" stroke="#d9e2ef" stroke-width="4"/>
      <rect x="28" y="52" width="104" height="60" rx="12" fill="#18233a"/>
      <circle cx="60" cy="78" r="8" fill="#f2b866"/><circle cx="100" cy="78" r="8" fill="#f2b866"/>
      <rect x="0" y="146" width="160" height="132" rx="20" fill="#9eaac2" stroke="#d9e2ef" stroke-width="4"/>
      <rect x="22" y="166" width="116" height="62" rx="10" fill="#18233a"/>
      <rect x="30" y="278" width="34" height="46" rx="10" fill="#6f7d96"/>
      <rect x="96" y="278" width="34" height="46" rx="10" fill="#6f7d96"/>
    </g>
    <g font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">
      <text x="1059" y="390" fill="#7fe0c0">OPENCODE</text>
      <text x="1139" y="390" fill="#f2b866">PI</text>
    </g>
  </g>

  <g font-family="DejaVu Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3">
    <text x="190" y="545" fill="#7fc8f2" text-anchor="middle">THE NEW HARNESS</text>
    <text x="555" y="545" fill="#c9bdf2" text-anchor="middle">BORROWED PARTS</text>
    <text x="960" y="545" fill="#f2c27b" text-anchor="middle">SAME LOGIN</text>
  </g>
</svg>
