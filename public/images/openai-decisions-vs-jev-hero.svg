<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI Decisions API vs Jev</title>
  <desc id="desc">Two comparison panels for OpenAI Decisions API and Jev, showing example-guided BANKING77 accuracy, mean latency, and estimated run cost. Decisions: 84.16%, 194 milliseconds, 30 cents. Jev: 85.32%, 520 milliseconds, 18 cents.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#081320"/><stop offset="1" stop-color="#14182e"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#80d7ff"/><stop offset="1" stop-color="#a79aff"/></linearGradient>
    <linearGradient id="green" x2="1" y2="1"><stop stop-color="#39dce0"/><stop offset="1" stop-color="#75edbb"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#aec4de" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1400" height="760" fill="url(#background)"/>
  <rect width="1400" height="760" fill="url(#grid)"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="80" y="70" fill="#91a9c3" font-size="17" font-weight="700" letter-spacing="3">JEV AS A BOUNDED DECISION MAKER · PART 5</text>
    <text x="80" y="146" fill="#f4f7fc" font-size="55" font-weight="700" letter-spacing="-1.5">OpenAI Decisions API vs Jev</text>
    <text x="82" y="192" fill="#a5b8cf" font-size="25">Accuracy · Latency · Cost</text>

    <rect x="80" y="246" width="590" height="376" rx="22" fill="#101e31" stroke="#34465f" stroke-width="2"/>
    <rect x="730" y="246" width="590" height="376" rx="22" fill="#0d232c" stroke="#2b4c52" stroke-width="2"/>
    <rect x="105" y="273" width="5" height="72" rx="2" fill="url(#blue)"/>
    <rect x="755" y="273" width="5" height="72" rx="2" fill="url(#green)"/>
    <text x="132" y="305" fill="#a9ddff" font-size="32" font-weight="700">Decisions API</text>
    <text x="132" y="338" fill="#92a9c4" font-size="18">OpenAI · powered by gpt-6-luna</text>
    <text x="782" y="305" fill="#77ebc5" font-size="32" font-weight="700">Jev</text>
    <text x="782" y="338" fill="#91b4b8" font-size="18">TypeSafe · jev-1.13.0</text>
    <path d="M110 367H640M760 367H1290" stroke="#35495e"/>

    <g fill="#a4b7cb" font-size="19">
      <text x="112" y="414">Accuracy</text><text x="762" y="414">Accuracy</text>
      <text x="112" y="488">Mean latency</text><text x="762" y="488">Mean latency</text>
      <text x="112" y="562">Run cost</text><text x="762" y="562">Run cost</text>
    </g>
    <g font-size="43" font-weight="700" text-anchor="end">
      <text x="635" y="428" fill="#f4f7fc">84.16%</text>
      <text x="1285" y="428" fill="#77ebc5">85.32%</text>
      <text x="635" y="502" fill="#a9ddff">194 ms</text>
      <text x="1285" y="502" fill="#f4f7fc">520 ms</text>
      <text x="635" y="576" fill="#f4f7fc">$0.30</text>
      <text x="1285" y="576" fill="#77ebc5">$0.18</text>
    </g>
    <text x="80" y="671" fill="#c4d0df" font-size="20">BANKING77 · 770 messages · Two examples per intent</text>
    <text x="80" y="710" fill="#8ea5be" font-size="15">Historical Jev timings · Estimated costs at current base rates</text>
    <text x="1320" y="710" fill="#a5b8cf" font-size="18" font-weight="700" text-anchor="end">StackToHeap</text>
  </g>
</svg>
