<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="t d" font-family="Noto Sans, DejaVu Sans, sans-serif"><title id="t">One engine, two workers</title><desc id="d">A client asks the Rivet engine for an agent by key. The engine, which handles placement, routing, sleep and wakeups and keeps each actor's SQLite database, routes the call to the worker node holding that actor. Worker n1 holds agents b, d and f, and worker n2 holds a, c and e, each with its own harness.</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f1f1e"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7c86"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2473b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><rect x="40" y="255" width="230" height="110" rx="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="4"/><text x="155.0" y="306.0" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle">Client</text><text x="155.0" y="336.0" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="middle">Knows only the engine</text><path d="M270 310H432" fill="none" stroke="#1f1f1e" stroke-width="5" stroke-linejoin="round" marker-end="url(#ak)"/><text x="351" y="290" font-size="21" fill="#1f1f1e" font-weight="700" text-anchor="middle">1. Ask by key</text><rect x="440" y="170" width="300" height="280" rx="18" fill="#fff" stroke="#0e7c86" stroke-width="5"/><text x="590" y="222" font-size="27" fill="#0e7c86" font-weight="700" text-anchor="middle">Rivet engine</text><text x="590" y="270" font-size="20" fill="#6b6a66" font-weight="400" text-anchor="middle">Placement</text><text x="590" y="310" font-size="20" fill="#6b6a66" font-weight="400" text-anchor="middle">Routing</text><text x="590" y="350" font-size="20" fill="#6b6a66" font-weight="400" text-anchor="middle">Sleep and wakeups</text><text x="590" y="390" font-size="20" fill="#6b6a66" font-weight="400" text-anchor="middle">Each actor's SQLite</text><rect x="920" y="50" width="440" height="240" rx="20" fill="#f1eee7" stroke="none" stroke-width="4"/><text x="948" y="96" font-size="27" font-weight="700" fill="#0e7c86">Worker n1<tspan dx="16" font-size="20" font-weight="400" fill="#6b6a66">A Node process</tspan></text><rect x="946" y="160" width="118" height="92" rx="12" fill="#fff" stroke="#dcd9d0" stroke-width="3"/><text x="1005.0" y="202" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">b</text><text x="1005.0" y="230" font-size="16" fill="#6b6a66" font-weight="400" text-anchor="middle">Harness</text><rect x="1080" y="160" width="118" height="92" rx="12" fill="#fff" stroke="#dcd9d0" stroke-width="3"/><text x="1139.0" y="202" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">d</text><text x="1139.0" y="230" font-size="16" fill="#6b6a66" font-weight="400" text-anchor="middle">Harness</text><rect x="1214" y="160" width="118" height="92" rx="12" fill="#fff" stroke="#dcd9d0" stroke-width="3"/><text x="1273.0" y="202" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">f</text><text x="1273.0" y="230" font-size="16" fill="#6b6a66" font-weight="400" text-anchor="middle">Harness</text><text x="948" y="142" font-size="18" fill="#6b6a66" font-weight="400" text-anchor="start">One actor per agent</text><rect x="920" y="350" width="440" height="240" rx="20" fill="#f1eee7" stroke="none" stroke-width="4"/><text x="948" y="396" font-size="27" font-weight="700" fill="#0e7c86">Worker n2<tspan dx="16" font-size="20" font-weight="400" fill="#6b6a66">A Node process</tspan></text><rect x="946" y="460" width="118" height="92" rx="12" fill="#fff" stroke="#dcd9d0" stroke-width="3"/><text x="1005.0" y="502" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">a</text><text x="1005.0" y="530" font-size="16" fill="#6b6a66" font-weight="400" text-anchor="middle">Harness</text><rect x="1080" y="460" width="118" height="92" rx="12" fill="#fff" stroke="#dcd9d0" stroke-width="3"/><text x="1139.0" y="502" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c</text><text x="1139.0" y="530" font-size="16" fill="#6b6a66" font-weight="400" text-anchor="middle">Harness</text><rect x="1214" y="460" width="118" height="92" rx="12" fill="#fff" stroke="#dcd9d0" stroke-width="3"/><text x="1273.0" y="502" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">e</text><text x="1273.0" y="530" font-size="16" fill="#6b6a66" font-weight="400" text-anchor="middle">Harness</text><text x="948" y="442" font-size="18" fill="#6b6a66" font-weight="400" text-anchor="start">One actor per agent</text><path d="M740 270H830V170H912" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><path d="M740 350H830V470H912" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><text x="835" y="302" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="middle">2. Route to</text><text x="835" y="329" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="middle">its node</text></svg>