<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d" font-family="Noto Sans, DejaVu Sans, sans-serif"><title id="t">An agent as an actor</title><desc id="d">Messages from users, other agents and timers arrive in the agent's mailbox, its submissions. A repeated request ID is dropped. The agent takes one message at a time into a run of model and tools, commits to its own storage, and can send to or create other actors or sleep until a timer wakes it. After a crash it reopens the storage and resumes.</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f1f1e"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7c86"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2473b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><rect x="40" y="225" width="230" height="110" rx="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="4"/><text x="155.0" y="276.0" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle">Messages</text><text x="155.0" y="306.0" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="middle">Users, agents, timers</text><text x="155" y="205" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="middle">1. A message arrives</text><rect x="400" y="40" width="640" height="680" rx="22" fill="#fff" stroke="#0e7c86" stroke-width="5"/><text x="430" y="92" font-size="30" font-weight="700" fill="#0e7c86">Agent = actor<tspan dx="16" font-size="20" font-weight="400" fill="#6b6a66">One owner, found by its key</tspan></text><rect x="430" y="120" width="580" height="262" rx="20" fill="#f1eee7" stroke="none" stroke-width="4"/><text x="458" y="166" font-size="27" font-weight="700" fill="#1f1f1e">Mailbox<tspan dx="16" font-size="20" font-weight="400" fill="#6b6a66">Submissions</tspan></text><rect x="452" y="186" width="536" height="46" rx="10" fill="#fff" stroke="#dcd9d0" stroke-width="3"/><text x="470" y="216" font-size="19" fill="#1f1f1e" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, monospace">hello</text><text x="970" y="216" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="end">done</text><rect x="452" y="244" width="536" height="46" rx="10" fill="none" stroke="#9c9a92" stroke-width="2.5" stroke-dasharray="9 7"/><text x="470" y="274" font-size="19" fill="#8b8982" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, monospace">hello, same requestId</text><text x="970" y="274" font-size="19" fill="#8b8982" font-weight="400" text-anchor="end">dropped</text><rect x="452" y="302" width="536" height="46" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="3"/><text x="470" y="332" font-size="19" fill="#1f1f1e" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, monospace">wait 40</text><text x="970" y="332" font-size="19" fill="#0e7c86" font-weight="700" text-anchor="end">pending</text><path d="M270 280H422" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><rect x="430" y="480" width="260" height="112" rx="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="4"/><text x="560.0" y="532.0" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle">Storage</text><text x="560.0" y="562.0" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="middle">Its own database</text><rect x="750" y="480" width="260" height="112" rx="16" fill="#ffffff" stroke="#0e7c86" stroke-width="4"/><text x="880.0" y="532.0" font-size="26" fill="#0e7c86" font-weight="700" text-anchor="middle">Run</text><text x="880.0" y="562.0" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="middle">Model and tools</text><path d="M880 382V472" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><text x="860" y="424" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="end">2. One at</text><text x="860" y="451" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="end">a time</text><path d="M750 536H698" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><text x="720" y="632" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="middle">3. Commit</text><text x="720" y="688" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="middle">After a crash: reopen the storage and resume</text><rect x="1150" y="400" width="220" height="104" rx="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="4"/><text x="1260.0" y="448.0" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle">Other actors</text><text x="1260.0" y="478.0" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="middle">On any node</text><rect x="1150" y="580" width="220" height="104" rx="16" fill="#ffffff" stroke="#1f1f1e" stroke-width="4"/><text x="1260.0" y="628.0" font-size="26" fill="#1f1f1e" font-weight="700" text-anchor="middle">Timer</text><text x="1260.0" y="658.0" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="middle">Wakes it later</text><path d="M1010 510H1090V452H1142" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><text x="1260" y="378" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="middle">4. Send or create</text><path d="M1010 560H1090V632H1142" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><text x="1260" y="558" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="middle">5. Sleep until</text></svg>