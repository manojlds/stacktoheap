<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="t d" font-family="Noto Sans, DejaVu Sans, sans-serif"><title id="t">A node dies and the run continues</title><desc id="d">Agent a on worker n2 arms a heartbeat with the Rivet engine, which keeps the schedule and the database. The node is killed after tick 11. When the heartbeat is due, the engine starts the actor on worker n1. The harness reopens and reruns the replay-safe tool, which reads its progress and continues from tick 12 to 40.</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f1f1e"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7c86"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2473b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker></defs><rect width="1400" height="700" fill="#ffffff"/><rect x="500" y="40" width="400" height="130" rx="18" fill="#fff" stroke="#0e7c86" stroke-width="5"/><text x="700" y="98" font-size="27" fill="#0e7c86" font-weight="700" text-anchor="middle">Rivet engine</text><text x="700" y="134" font-size="19" fill="#6b6a66" font-weight="400" text-anchor="middle">Keeps the schedule and the database</text><rect x="820" y="380" width="520" height="270" rx="20" fill="#fbf1ef" stroke="#c2473b" stroke-width="4" stroke-dasharray="12 9"/><text x="848" y="426" font-size="27" font-weight="700" fill="#c2473b">Worker n2<tspan dx="16" font-size="20" font-weight="400" fill="#6b6a66">Gone</tspan></text><rect x="850" y="458" width="150" height="92" rx="12" fill="#fff" stroke="#c2473b" stroke-width="3" stroke-dasharray="8 7"/><text x="925.0" y="500" font-size="26" fill="#c2473b" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">a</text><text x="925.0" y="528" font-size="16" fill="#6b6a66" font-weight="400" text-anchor="middle">ticks 1-11</text><text x="1030" y="500" font-size="22" fill="#c2473b" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, monospace">$ kill -9</text><text x="1030" y="540" font-size="21" fill="#c2473b" font-weight="700" text-anchor="start">2. The node dies</text><text x="1030" y="567" font-size="21" fill="#c2473b" font-weight="700" text-anchor="start">in the middle of a run</text><rect x="60" y="380" width="520" height="270" rx="20" fill="#f1eee7" stroke="none" stroke-width="4"/><text x="88" y="426" font-size="27" font-weight="700" fill="#0e7c86">Worker n1<tspan dx="16" font-size="20" font-weight="400" fill="#6b6a66">Still running</tspan></text><rect x="90" y="458" width="150" height="92" rx="12" fill="#fff" stroke="#0e7c86" stroke-width="3"/><text x="165.0" y="500" font-size="26" fill="#0e7c86" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">a</text><text x="165.0" y="528" font-size="16" fill="#6b6a66" font-weight="400" text-anchor="middle">ticks 12-40</text><text x="266" y="478" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="start">4. The harness reopens</text><text x="266" y="505" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="start">and reruns the safe tool</text><text x="266" y="560" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="start">5. The tool reads its</text><text x="266" y="587" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="start">progress: next is 12</text><path d="M1080 372V105H908" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><text x="1102" y="228" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="start">1. start arms a</text><text x="1102" y="255" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="start">heartbeat, 20 s out</text><path d="M500 105H320V372" fill="none" stroke="#0e7c86" stroke-width="5" stroke-linejoin="round" marker-end="url(#ac)"/><text x="342" y="228" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="start">3. The heartbeat is due:</text><text x="342" y="255" font-size="21" fill="#0e7c86" font-weight="700" text-anchor="start">start the actor here</text></svg>